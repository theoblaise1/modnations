# Compilation et vérifications de Sovereign Frontier à chaque push / pull request.
name: Build

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

# Annule les exécutions devenues obsolètes sur la même référence (branche ou PR).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Compilation et vérifications
    runs-on: ubuntu-latest
    steps:
      - name: Récupération du dépôt
        uses: actions/checkout@v4

      - name: Installation de Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Installation de Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Version de Pillow figée pour que la génération des textures soit reproductible.
      - name: Installation de Pillow
        run: python -m pip install pillow==12.3.0

      # Cache Gradle (dépendances, artefacts Minecraft/NeoForge) et validation du wrapper.
      - name: Configuration de Gradle
        uses: gradle/actions/setup-gradle@v4

      # Aucune référence au code client hors du paquet client (sécurité serveur dédié).
      - name: Vérification serveur dédié
        run: python tools/check_sides.py

      # Les textures et structures versionnées doivent correspondre à celles des générateurs.
      - name: Vérification des textures générées
        run: python tools/gen_textures.py --check

      - name: Vérification des structures NBT générées
        run: python tools/gen_structures.py --check

      # Paliers de recherche : schéma, séquences, prérequis sans cycle, conformité à docs/recherche.md,
      # câblage des déblocages (jalon ≤ WIRED_UP_TO) et matériaux spatiaux dans les coûts (J5).
      - name: Vérification de l'arbre de recherche
        run: |
          python tools/check_research.py --self-test
          python tools/check_research.py

      # Économie (J4) : tags d'interdiction (paliers 3/4, fusée finale, arme max), recettes sans objet
      # restreint ni clé de caisse, contenu des marchands, caisses, /daily, contrats et entreprises.
      - name: Vérification de l'économie
        run: |
          python tools/check_economy.py --self-test
          python tools/check_economy.py

      # Espace (J5) : planètes (schéma, bornes du code, objets, clés du catalogue, tags de minerais, module dans
      # #restreint/fusee_finale, traductions) ; dimensions à partir du lot WP1.
      - name: Vérification de l'espace
        run: |
          python tools/check_space.py --self-test
          python tools/check_space.py

      # Toute clé de traduction utilisée dans le code doit exister, et le fichier de langue reste trié.
      - name: Vérification des traductions
        run: python tools/check_lang.py

      - name: Compilation Gradle
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon

      # Serveur dédié headless (cible forgeserverdev) : charge le mod sans aucune classe
      # cliente et exécute les GameTests ; échoue si un test requis échoue.
      - name: GameTests sur serveur headless
        run: ./gradlew runGameTestServer --no-daemon

      - name: Publication du JAR
        uses: actions/upload-artifact@v4
        with:
          name: sovereignfrontier-${{ github.sha }}
          path: build/libs/*.jar
          if-no-files-found: error
